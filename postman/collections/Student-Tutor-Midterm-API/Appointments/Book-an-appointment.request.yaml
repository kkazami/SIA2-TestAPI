$kind: http-request
name: Book an appointment
order: 3000
method: POST
url: '{{baseUrl}}/api/v1/appointments'
description: 'Role: Student. Success: 201. Failure: Already booked → 409; missing slot → 404.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "slotId": {{slotId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("appointmentId", pm.response.json().id);
