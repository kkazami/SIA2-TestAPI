$kind: http-request
name: Reschedule or cancel appointment
order: 4000
method: PATCH
url: '{{baseUrl}}/api/v1/appointments/{{appointmentId}}'
description: 'Role: Student, owning Tutor, or Admin. Success: 200. Failure: Empty patch → 400; unrelated user → 403.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Cancelled"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP 200", () => pm.response.to.have.status(200));
