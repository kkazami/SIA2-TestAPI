$kind: http-request
name: Update a slot
order: 3000
method: PUT
url: '{{baseUrl}}/api/v1/availability/{{slotId}}'
description: 'Role: Tutor or Admin. Success: 200. Failure: Missing slot → 404; slot has appointment history → 409.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tutorId": {{tutorId}},
      "startUtc": "{{slotStart}}",
      "endUtc": "{{slotEnd}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Expected HTTP 200", () => pm.response.to.have.status(200));
